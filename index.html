<style>
/* Kitaplık ile aynı görsel dil */
:root{
  --bg:#EDF2FF; --paper:#FFFFFF; --ink:#0A1633; --muted:#5C6B8E; --faint:#8C99B8; --line:#E0E8FA;
  --marka:#2E5BFF; --focus:#2E5BFF;
  --done:#2E5BFF; --l1:#D6E0FF; --l2:#8FA8FF; --l3:#2E5BFF;
  --bar:rgba(237,242,255,.84); --bar-line:rgba(224,232,250,.9); --glow:1;
  --shadow:0 1px 2px rgba(10,22,51,.05), 0 6px 18px -10px rgba(46,91,255,.28);
  color-scheme:light;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#0B1226; --paper:#131C36; --ink:#E6ECFF; --muted:#9AA8CC; --faint:#6C7A9E; --line:#243056;
  --marka:#7D9BFF; --focus:#7D9BFF;
  --done:#7D9BFF; --l1:#1E2C5C; --l2:#2F48A8; --l3:#5B7CFF;
  --bar:rgba(11,18,38,.82); --bar-line:rgba(36,48,86,.9); --glow:.55;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1226; --paper:#131C36; --ink:#E6ECFF; --muted:#9AA8CC; --faint:#6C7A9E; --line:#243056;
  --marka:#7D9BFF; --focus:#7D9BFF;
  --done:#7D9BFF; --l1:#1E2C5C; --l2:#2F48A8; --l3:#5B7CFF;
  --bar:rgba(11,18,38,.82); --bar-line:rgba(36,48,86,.9); --glow:.55;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--glow);
  background:
    radial-gradient(52% 42% at 12% -6%, rgba(46,91,255,.30), transparent 62%),
    radial-gradient(46% 38% at 88% -2%, rgba(6,174,207,.30), transparent 60%),
    radial-gradient(40% 34% at 62% 8%, rgba(124,77,255,.16), transparent 65%);
}
/* ——— Marka çubuğu (Kitaplık ile aynı) ——— */
.ust-cubuk{
  position:sticky;top:0;z-index:40;
  background:var(--bar);
  backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
  border-bottom:1px solid var(--bar-line);
}
.ust-cubuk .wrap{max-width:520px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:11px 0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.brand:focus-visible{outline:2px solid var(--marka);outline-offset:4px;border-radius:6px}
.brand-logo{width:1.75rem;height:1.75rem;object-fit:contain;flex-shrink:0}
.brand h1{margin:0;font-family:var(--serif);font-weight:600;font-size:1.6rem;letter-spacing:-.02em;color:var(--ink)}
.brand .count{font-size:.74rem;font-weight:600;letter-spacing:.02em;color:var(--marka);background:rgba(46,91,255,.10);border-radius:999px;padding:4px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ubtn{
  font:600 .78rem/1 var(--sans);color:var(--marka);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:9px 12px;display:inline-flex;align-items:center;gap:7px;
  box-shadow:var(--shadow);transition:transform .14s;
}
.ubtn:hover{transform:translateY(-1px)}
.ubtn svg{width:1.15em;height:1.15em;fill:currentColor}
#themeBtn[data-mode="light"] svg{transform:none}
#themeBtn[data-mode="dark"] svg{transform:rotate(180deg)}
#themeBtn[data-mode="auto"] svg{transform:rotate(90deg)}
@media (max-width:760px){
  .brand{padding:9px 0 8px}
  .brand-logo{width:1.4rem;height:1.4rem}
  .brand h1{font-size:1.3rem}
}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.day-head{display:flex;align-items:center;gap:8px}
.day-head h2{font-size:1.75rem;line-height:1.15;flex:1}
.nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.1rem}
.sub{color:var(--muted);margin:4px 0 0;min-height:1.5em}
.today-link{background:none;border:0;color:var(--focus);padding:0;text-decoration:underline}

.tally{margin:20px 0 12px;display:flex;align-items:baseline;gap:10px}
.tally b{font-family:var(--serif);font-weight:600;font-size:3.2rem;line-height:1;color:var(--done)}
.tally span{color:var(--muted)}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 0;box-shadow:var(--shadow)}
.add{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.add input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 4px}
.add button{border:0;border-radius:999px;background:linear-gradient(135deg,#2E5BFF,#6C4BFF);color:#fff;font-weight:600;padding:8px 14px;font-weight:500}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{opacity:0;transition:opacity .15s}
li.done .check{background:var(--done);border-color:var(--done)}
li.done .check svg{opacity:1}
li.done .txt{color:var(--muted)}
.txt{flex:1;overflow-wrap:anywhere}
.del{border:0;background:none;color:var(--muted);font-size:1.3rem;width:32px;height:32px;border-radius:6px}
.empty{padding:18px 14px;color:var(--muted)}
li.pop .check{animation:pop .3s ease-out}
@keyframes pop{50%{transform:scale(1.2)}}

.cal{margin-top:32px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font-size:1.25rem}
.streak{color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:.75rem;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
.cell small{font-size:.7rem;font-weight:600}
.cell.l1{background:var(--l1);border-color:transparent}
.cell.l2{background:var(--l2);border-color:transparent}
.cell.l3{background:var(--l3);border-color:transparent;color:#fff}
.cell.l2{color:#fff}
.cell.future{color:var(--muted)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.today{font-weight:700}
.blank{visibility:hidden}
.foot{margin-top:24px;font-size:.85rem;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;margin:14px 0;font-weight:500}
dialog input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;justify-content:flex-end;gap:8px}
.row button{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 14px}
.row .primary{background:linear-gradient(135deg,#2E5BFF,#6C4BFF);color:#fff;border-color:transparent}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

  <button class="ubtn" id="settings" type="button" aria-label="Bağlantı ayarları"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z"/></svg></button>
</div></div>

<main>
  <div class="day-head">
    <button class="nav" id="prev" aria-label="Önceki gün">‹</button>
    <h2 id="dayTitle">Bugün</h2>
    <button class="nav" id="next" aria-label="Sonraki gün">›</button>
  </div>
  <p class="sub" id="daySub"></p>

  <div class="tally"><b id="count">0</b><span id="countLabel">iş bitti</span></div>

  <section class="sheet">
    <form class="add" id="addForm">
      <input id="newTask" autocomplete="off" placeholder="Küçük bir görev yaz, ör. tez önerisinin ilk bölümünü oku" aria-label="Yeni görev">
      <button type="submit">Ekle</button>
    </form>
    <ul id="list"></ul>
  </section>

  <section class="cal">
    <div class="cal-head">
      <button class="nav" id="mPrev" aria-label="Önceki ay">‹</button>
      <h2 id="monthTitle"></h2>
      <button class="nav" id="mNext" aria-label="Sonraki ay">›</button>
    </div>
    <p class="streak" id="streak"></p>
    <div class="grid" id="grid"></div>
  </section>

  <p class="foot"><span id="foot">Kayıtlar yükleniyor…</span></p>

  <dialog id="setup">
    <form method="dialog" id="setupForm">
      <h2>Bağlantı ayarları</h2>
      <p class="sub">Google E-Tablo betiğinde belirlediğin şifreyi gir. Bu cihazda bir kez girmen yeterli.</p>
      <label>Şifre<input id="tokenIn" type="password" autocomplete="current-password" required></label>
      <div class="row"><button value="cancel" type="button" id="cancelSetup">Vazgeç</button><button value="ok" class="primary">Kaydet</button></div>
    </form>
  </dialog>
</main>

<script>
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const WD=["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
const DAYNAMES=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const todayKey=()=>key(new Date());
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return key(d)};

let days={};            // "YYYY-MM-DD" -> [{id,t,done}]
let current=todayKey();
let viewMonth=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})();
let lastPop=null;

// ---- storage ----
// Google Apps Script web uygulamasının /exec adresini buraya yapıştır:
const SCRIPT_URL = "BURAYA_APPS_SCRIPT_EXEC_ADRESI";

const LS="gunluk-kayit-v1", LS_PENDING="gunluk-bekleyen-v1", LS_TOKEN="gunluk-sifre-v1";
let pending=new Set(), timers={};
const $foot=()=>document.getElementById("foot");
const getToken=()=>{try{return localStorage.getItem(LS_TOKEN)||""}catch(e){return ""}};

function loadLocal(){
  try{const v=localStorage.getItem(LS);if(v)days=JSON.parse(v)||{}}catch(e){}
  try{pending=new Set(JSON.parse(localStorage.getItem(LS_PENDING)||"[]"))}catch(e){}
}
function saveLocal(){
  try{localStorage.setItem(LS,JSON.stringify(days));localStorage.setItem(LS_PENDING,JSON.stringify([...pending]))}catch(e){}
}
function persist(k){
  pending.add(k);saveLocal();
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>push(k),700);   // hızlı işaretlemeleri tek yazmada topla
}
async function push(k){
  const token=getToken();
  if(!token||SCRIPT_URL.startsWith("BURAYA")){$foot().textContent="Bağlantı kurulmadı; kayıtlar şimdilik bu cihazda.";return false}
  try{
    const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({token,date:k,items:days[k]||[]})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"hata");
    pending.delete(k);saveLocal();
    $foot().textContent=pending.size?`${pending.size} gün gönderilmeyi bekliyor.`:"Tüm kayıtlar E-Tabloya kaydedildi.";
    return true;
  }catch(e){
    $foot().textContent=e.message==="yetki"?"Şifre hatalı; bağlantı ayarlarını kontrol et.":"E-Tabloya ulaşılamadı; değişiklik bu cihazda bekliyor, bağlantı gelince gönderilecek.";
    return false;
  }
}
async function connect(){
  const token=getToken();
  if(SCRIPT_URL.startsWith("BURAYA")){$foot().textContent="Betik adresi girilmemiş; kayıtlar şimdilik bu cihazda.";return}
  if(!token){openSetup();$foot().textContent="Şifre girilmedi; kayıtlar şimdilik bu cihazda.";return}
  $foot().textContent="E-Tablodan yükleniyor…";
  try{
    const r=await fetch(`${SCRIPT_URL}?token=${encodeURIComponent(token)}`);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"hata");
    const fresh=j.days||{};
    pending.forEach(k=>{ if(days[k]&&days[k].length) fresh[k]=days[k]; else delete fresh[k]; }); // bekleyen yerel değişiklikler öncelikli
    days=fresh;saveLocal();render();
    for(const k of [...pending]) await push(k);
    if(!pending.size)$foot().textContent="Tüm kayıtlar E-Tabloya kaydedildi.";
  }catch(e){
    $foot().textContent=e.message==="yetki"?"Şifre hatalı; bağlantı ayarlarını kontrol et.":"E-Tabloya ulaşılamadı; bu cihazdaki son kopya gösteriliyor.";
  }
}
function openSetup(){const d=document.getElementById("setup");document.getElementById("tokenIn").value=getToken();if(!d.open)d.showModal()}
window.addEventListener("online",()=>connect());

// ---- actions ----
function addTask(t){
  t=t.trim(); if(!t) return;
  (days[current]=days[current]||[]).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t,done:false});
  persist(current);render();
}
function toggle(id){
  const it=(days[current]||[]).find(x=>x.id===id); if(!it) return;
  it.done=!it.done; lastPop=it.done?id:null;
  persist(current);render();
}
function remove(id){
  days[current]=(days[current]||[]).filter(x=>x.id!==id);
  if(!days[current].length) delete days[current];
  persist(current);render();
}
function go(k){
  current=k;const d=fromKey(k);
  viewMonth=new Date(d.getFullYear(),d.getMonth(),1);
  render();
}

// ---- render ----
const doneCount=k=>(days[k]||[]).filter(x=>x.done).length;

function render(){
  const d=fromKey(current), tk=todayKey();
  const rel=current===tk?"Bugün":current===addDays(tk,-1)?"Dün":current===addDays(tk,1)?"Yarın":null;
  document.getElementById("dayTitle").textContent=rel||`${d.getDate()} ${AYLAR[d.getMonth()]}`;
  const sub=document.getElementById("daySub");
  sub.textContent=`${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()}, ${DAYNAMES[d.getDay()]}`;
  if(current!==tk){const b=document.createElement("button");b.className="today-link";b.textContent="Bugüne dön";b.onclick=()=>go(tk);sub.append("  ",b)}

  const items=days[current]||[], n=doneCount(current);
  document.getElementById("count").textContent=n;
  document.getElementById("countLabel").textContent=
    current>tk?`/ ${items.length} planlandı`:items.length>n?`iş bitti, ${items.length-n} açık`:"iş bitti";

  const ul=document.getElementById("list");ul.innerHTML="";
  if(!items.length){
    const p=document.createElement("li");p.className="empty";
    p.textContent=current>=tk?"Henüz görev yok. Yarım saatte bitecek bir şeyle başla.":"Bu güne kayıt girilmemiş. Yaptığın bir şeyi ekleyip işaretleyebilirsin.";
    ul.append(p);
  }
  items.forEach(it=>{
    const li=document.createElement("li");
    if(it.done)li.classList.add("done");
    if(it.id===lastPop)li.classList.add("pop");
    const c=document.createElement("button");c.className="check";
    c.setAttribute("aria-label",it.done?"Tamamlandı işaretini kaldır":"Tamamlandı olarak işaretle");
    c.setAttribute("aria-pressed",it.done);
    c.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    c.onclick=()=>toggle(it.id);
    const s=document.createElement("span");s.className="txt";s.textContent=it.t;
    const x=document.createElement("button");x.className="del";x.textContent="×";x.setAttribute("aria-label","Sil");
    x.onclick=()=>remove(it.id);
    li.append(c,s,x);ul.append(li);
  });
  lastPop=null;
  const tn=doneCount(todayKey());
  document.getElementById("plateMeta").textContent=`Bugün ${tn} iş`;
  renderCal();
}

function renderCal(){
  const y=viewMonth.getFullYear(), m=viewMonth.getMonth(), tk=todayKey();
  document.getElementById("monthTitle").textContent=`${AYLAR[m]} ${y}`;
  const g=document.getElementById("grid");g.innerHTML="";
  WD.forEach(w=>{const e=document.createElement("div");e.className="wd";e.textContent=w;g.append(e)});
  const lead=(new Date(y,m,1).getDay()+6)%7;
  for(let i=0;i<lead;i++){const e=document.createElement("div");e.className="cell blank";g.append(e)}
  const last=new Date(y,m+1,0).getDate();
  for(let dd=1;dd<=last;dd++){
    const k=`${y}-${pad(m+1)}-${pad(dd)}`, n=doneCount(k), planned=(days[k]||[]).length;
    const b=document.createElement("button");b.className="cell";
    if(n>=5)b.classList.add("l3");else if(n>=3)b.classList.add("l2");else if(n>=1)b.classList.add("l1");
    if(k>tk)b.classList.add("future");
    if(k===tk)b.classList.add("today");
    if(k===current)b.classList.add("sel");
    b.innerHTML=`<span>${dd}</span>`;
    if(n) b.insertAdjacentHTML("beforeend",`<small>${n}</small>`);
    else if(k>tk&&planned) b.insertAdjacentHTML("beforeend",`<small>·${planned}</small>`);
    b.setAttribute("aria-label",`${dd} ${AYLAR[m]}: ${n} tamamlandı`);
    b.onclick=()=>go(k);
    g.append(b);
  }
  // streak: consecutive days with ≥1 done, ending today (or yesterday if today empty)
  let k=tk, s=0;
  if(!doneCount(k))k=addDays(k,-1);
  while(doneCount(k)){s++;k=addDays(k,-1)}
  const monthDone=Object.keys(days).filter(x=>x.startsWith(`${y}-${pad(m+1)}`)).reduce((a,x)=>a+doneCount(x),0);
  document.getElementById("streak").textContent=
    `${AYLAR[m]} ayında ${monthDone} iş bitti. `+(s?`Üst üste ${s} gündür boş gün yok.`:"Bugün bir iş bitirince seri başlar.");
}

// ---- wire up ----
document.getElementById("addForm").addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("newTask");addTask(i.value);i.value="";i.focus()});
document.getElementById("prev").onclick=()=>go(addDays(current,-1));
document.getElementById("next").onclick=()=>go(addDays(current,1));
document.getElementById("mPrev").onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);renderCal()};
document.getElementById("mNext").onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);renderCal()};

document.getElementById("settings").onclick=openSetup;
document.getElementById("refresh").onclick=()=>connect();
const brandEl=document.getElementById("brand");
brandEl.onclick=()=>{go(todayKey());window.scrollTo({top:0,behavior:"smooth"})};
brandEl.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();brandEl.onclick()}};
document.getElementById("cancelSetup").onclick=()=>document.getElementById("setup").close();
document.getElementById("setupForm").addEventListener("submit",()=>{
  try{localStorage.setItem(LS_TOKEN,document.getElementById("tokenIn").value.trim())}catch(e){}
  connect();
});

// ---- tema: otomatik → açık → koyu ----
const THEME_KEY="galle-tema", THEMES=["auto","light","dark"], THEME_AD={auto:"otomatik",light:"açık",dark:"koyu"};
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  const m=document.querySelector('meta[name="theme-color"]'); if(m)m.content=dark?"#0B1226":"#EDF2FF";
  const b=document.getElementById("themeBtn");
  b.setAttribute("aria-label",`Tema: ${THEME_AD[t]}`); b.title=`Tema: ${THEME_AD[t]}`;
  b.dataset.mode=t;
}
let theme="auto"; try{theme=localStorage.getItem(THEME_KEY)||"auto"}catch(e){}
applyTheme(theme);
document.getElementById("themeBtn").onclick=()=>{
  theme=THEMES[(THEMES.indexOf(theme)+1)%3];
  try{localStorage.setItem(THEME_KEY,theme)}catch(e){}
  applyTheme(theme);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyTheme(theme));

loadLocal();render();connect();

// ---- PWA: çevrimdışı açılış ----
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
